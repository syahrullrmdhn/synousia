<style>
html,body{margin:0}body{background:var(--surface);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:26px;-webkit-font-smoothing:antialiased}
.seat{stroke:var(--ink)}.fire{fill:var(--percik)}.kata path{fill:var(--ink)}
.logo{display:flex;align-items:center;gap:10px}
.site{background:var(--surface);padding:0 var(--space-6) var(--space-7)}
nav{display:flex;align-items:center;justify-content:space-between;padding:var(--space-5) 0;border-bottom:1px solid var(--line)}
.menu{display:flex;gap:var(--space-5);font-size:15px;font-weight:500}
.menu a{color:var(--ink);text-decoration:none}
.btn{display:inline-block;border-radius:var(--radius-md);font-weight:600;font-size:15px;padding:var(--space-3) var(--space-4);text-decoration:none}
.utama{background:var(--percik);color:var(--on-percik)}
.kedua{color:var(--daun);border:1.5px solid var(--daun)}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:var(--space-6);align-items:center;padding-top:var(--space-7)}
.lbl{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--daun)}
h1{font-family:var(--font-display);font-size:56px;line-height:58px;letter-spacing:-.02em;margin:var(--space-3) 0;text-wrap:balance}
.lead{font-size:18px;line-height:28px;color:var(--ink-muted);max-width:30em;margin:0 0 var(--space-5)}
.aksi{display:flex;gap:var(--space-3);flex-wrap:wrap}
.seni{position:relative;height:240px}
.seni .a{position:absolute;inset:0 0 0 30px;background:var(--senja);border-radius:var(--radius-lg)}
.seni .b{position:absolute;left:0;bottom:24px;width:120px;height:120px;border-radius:50%;background:var(--percik)}
.seni svg{position:absolute;right:28px;top:28px}
.seni .seat{stroke:var(--ink)}
.seni .fire{fill:var(--percik)}
.q{position:absolute;right:28px;bottom:24px;left:150px;font-family:var(--font-kutipan);font-style:italic;font-size:20px;line-height:26px}
</style>
</head>
